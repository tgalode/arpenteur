name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Installeur (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust-targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: windows-latest
            rust-targets: ""
            args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le tag correspond aux versions
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package=$(node -p "require('./package.json').version")
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          status=0
          for source in "package.json:$package" "src-tauri/tauri.conf.json:$tauri" "src-tauri/Cargo.toml:$cargo"; do
            file=${source%%:*}
            version=${source#*:}
            if [ "$version" != "$TAG" ]; then
              echo "Le tag $TAG ne correspond pas à la version $version de $file."
              status=1
            fi
          done
          exit $status

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Arpenteur ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
