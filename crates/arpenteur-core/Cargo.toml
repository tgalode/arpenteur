[package]
name = "arpenteur-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
ego-tree = "0.11.1"
flate2 = "1"
quick-xml = "0.40"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip"] }
scraper = "0.27"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
siteone-crawler = { version = "=2.5.1", default-features = false }
tokio = "1"
tokio-util = "0.7"
url = "2.5.8"

[dev-dependencies]
tempfile = "3"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
